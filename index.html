<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ТУШЛАР МОЗОРИ | Жонтемир</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DARK MODE (Default) */
            --bg-color: #0c0c0b;
            --text-primary: #d9d4c7;
            --text-secondary: #8f8a80;
            --accent: #e0648f;
            --white: #f0eee7;
            --black: #050505;
            --grain-opacity: 0.15;
            --tape-bg: rgba(224, 100, 143, 0.15);
            --border-color: #333;
        }

        [data-theme="xerox"] {
            /* XEROX MODE */
            --bg-color: #dedbd2;
            --text-primary: #11110f;
            --text-secondary: #555;
            --accent: #d82b6a;
            --white: #050505;
            --black: #f0eee7;
            --grain-opacity: 0.4;
            --tape-bg: rgba(216, 43, 106, 0.2);
            --border-color: #999;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', monospace;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Accessibility */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        /* SVG Grain Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: var(--grain-opacity);
            mix-blend-mode: overlay;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            3% { opacity: 0.4; }
            6% { opacity: 1; }
            7% { opacity: 0.4; }
            8% { opacity: 1; }
            9% { opacity: 1; }
            10% { opacity: 0.1; }
            11% { opacity: 1; }
            100% { opacity: 1; }
        }

        .view {
            display: none;
            min-height: 100vh;
            width: 100%;
            padding: calc(env(safe-area-inset-top) + 2rem) calc(env(safe-area-inset-right) + 2rem) calc(env(safe-area-inset-bottom) + 2rem) calc(env(safe-area-inset-left) + 2rem);
        }

        .view.active {
            display: block;
        }

        /* Header Controls */
        header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        button.invert-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'IBM Plex Mono', monospace;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
        }
        button.invert-btn:hover {
            background: var(--accent);
            color: var(--bg-color);
        }

        /* Decor Metadata */
        .metadata {
            position: fixed;
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            pointer-events: none;
            z-index: 50;
        }
        .meta-tl { top: 20px; left: 20px; }
        .meta-bl { bottom: 20px; left: 20px; }

        /* Cover Page */
        #view-cover {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 10vw;
            position: relative;
        }

        h1.cover-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(64px, 13vw, 190px);
            line-height: 1;
            text-transform: uppercase;
            animation: flicker 4s infinite, film-cut 0.5s steps(3, end);
        }

        @keyframes film-cut {
            0% { transform: translateY(20px); opacity: 0; }
            50% { transform: translateY(-10px); opacity: 0.5; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .tape {
            background: var(--tape-bg);
            color: var(--accent);
            padding: 5px 15px;
            transform: rotate(-2deg);
            margin-top: 1rem;
            font-size: clamp(14px, 2vw, 20px);
            border: 1px solid rgba(224, 100, 143, 0.3);
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
            display: inline-block;
        }

        .cover-rules {
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: clamp(12px, 1.5vw, 16px);
            line-height: 1.6;
        }

        .enter-btn {
            margin-top: 4rem;
            display: inline-block;
            text-decoration: none;
            color: var(--bg-color);
            background: var(--accent);
            padding: 10px 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            transition: transform 0.2s;
        }
        .enter-btn:hover {
            transform: scale(1.05);
        }

        /* TOC Page */
        #view-toc {
            max-width: 900px;
            margin: 0 auto;
            padding-top: 100px;
        }

        .stamp {
            display: inline-block;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            transform: rotate(-7deg);
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .toc-list {
            list-style: none;
            border-top: 1px solid var(--border-color);
        }

        .toc-item a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-primary);
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            transition: padding-left 0.3s;
        }

        .toc-item a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.3s;
        }

        .toc-item a:hover {
            background: rgba(224, 100, 143, 0.05);
            padding-left: 20px;
        }
        .toc-item a:hover::before {
            transform: scaleY(1);
        }

        .toc-num {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            color: var(--text-secondary);
            width: 50px;
            transition: color 0.3s;
        }
        .toc-item a:hover .toc-num {
            color: var(--accent);
        }

        .toc-title {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            flex-grow: 1;
        }

        /* Poem Page */
        .poem-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 0 100px 0;
        }

        .nav-back {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 2rem;
            font-size: 14px;
        }
        .nav-back:hover {
            color: var(--accent);
        }

        .poem-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(32px, 6vw, 64px);
            margin-bottom: 1rem;
            text-shadow: 4px 0 var(--accent);
            text-transform: uppercase;
        }

        .poem-author {
            color: var(--text-secondary);
            margin-bottom: 4rem;
            font-size: 16px;
        }
        .poem-author span {
            color: var(--accent);
        }

        .poem-content {
            font-size: 20px;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        .poem-line {
            opacity: 0;
            transition: opacity 0.5s;
        }

        .poem-line.visible {
            animation: line-reveal 0.3s steps(3, end) forwards;
        }

        @keyframes line-reveal {
            0% { opacity: 0; }
            33% { opacity: 0.4; }
            66% { opacity: 0.15; }
            100% { opacity: 1; }
        }

        /* Navigation Bottom */
        .poem-nav-bottom {
            margin-top: 6rem;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed var(--border-color);
            padding-top: 2rem;
        }

        .poem-nav-bottom a {
            color: var(--accent);
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
        }
        .poem-nav-bottom a:hover {
            text-decoration: underline;
        }

        /* Progress Bar */
        #read-progress {
            position: fixed;
            top: 0;
            right: 0;
            width: 2px;
            height: 0%;
            background: var(--accent);
            z-index: 900;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            margin-top: 4rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .view {
                padding: calc(env(safe-area-inset-top) + 1rem) 18px calc(env(safe-area-inset-bottom) + 1rem) 18px;
            }
            .poem-content {
                font-size: 17px;
                line-height: 1.8;
            }
            .toc-item a {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 0;
            }
            .toc-num {
                font-size: 14px;
                margin-bottom: 5px;
            }
            #view-cover {
                padding-left: 0;
                align-items: center;
                text-align: center;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
            .poem-line {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>
    
    <svg class="noise">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>

    <header>
        <button class="invert-btn" id="invertBtn">ИНВЕРСИЯ</button>
    </header>

    <div class="metadata meta-tl">ARCHIVE No. 001</div>
    <div class="metadata meta-bl">FOUND / UNKNOWN DATE</div>

    <div id="read-progress"></div>

    <!-- COVER -->
    <main id="view-cover" class="view active">
        <h1 class="cover-title">ТУШЛАР<br>МОЗОРИ</h1>
        <div class="tape">Жонтемир — шеърлар тўплами</div>
        <div class="cover-rules">
            Биринчи қоида: жим кет.<br>
            Иккинчи қоида: жим кет.
        </div>
        <a href="#/toc" class="enter-btn">КИРИШ</a>
    </main>

    <!-- TOC -->
    <main id="view-toc" class="view">
        <div class="stamp">11 ШЕЪР</div>
        <ul class="toc-list" id="tocList"></ul>
    </main>

    <!-- POEM PAGE -->
    <main id="view-poem" class="view">
        <div class="poem-container">
            <a href="#/toc" class="nav-back">← МУНДАРИЖА</a>
            <h1 class="poem-title" id="poemTitle"></h1>
            <div class="poem-author">Жонтемир <br><span>@Jontemir</span></div>
            <div class="poem-content" id="poemContent"></div>
            
            <div class="poem-nav-bottom" id="poemNav"></div>
        </div>
        
        <footer>
            ТУШЛАР МОЗОРИ<br>Жонтемир<br>@Jontemir<br><br>
            END OF ARCHIVE
        </footer>
    </main>

    <script>
        // Barcha she'rlar to'liq hajmda kiritildi. 
        const poems = [
            {
                id: "chilyosin",
                title: "ЧИЛЁСИН",
                content: `Қовурғасин синдирганда шом,
Кун беркитгач жиноятларин.
Қамчиларкан тентак шамолни,
Осмон ўқир жин оятларин.
Ғувв-ғувв, ғирр-ғирр...
Жазавга тушар жавониб,
Ерни қаттиқ тишлайди илдиз.
Манглайига тираб ҳавонинг,
Ўқ узади елдирим — милтиқ.
Ғувв-ғувв, ғирр-ғирр...
Оғочларга сачрайди қўрқув,
Олам кияр қора калапўш.
Кўрмай дея жазокор турқин,
Тешик излар гуноҳ — каламуш.
Ғувв-ғувв, ғирр-ғирр...
Илдамлайди юлдузлар ўтлаб,
Қўйчивонга қўйган ихлосин.
Сув пуркаркан мулло булутлар,
Табиатни қилар "Чилёсин".
Ғувв-ғувв, ғирр-ғирр...
Жинлар қочар девлар қошига,
Девлар чопар кўзаси томон.
Кўзгу тутиб узук тошига,
Қаҳ-қаҳ отар фалак — Сулаймон!
Ғувв-ғувв, ғирр-ғирр...`
            },
            {
                id: "jontemir-1",
                title: "ЖОНТЕМИР",
                content: `Эй қаноти кашта капалак,
Эй руҳимни чайқатган балиқ.
Очилмаган гулларим тала,
Сув кўрмаган саҳройимда балқ!
Эй сўлаги муборак илон,
Эй туёғи чўғ сочар кийик.
Тасодифий дардларимни чақ,
Эмиз сутинг келганда ийиб!
Эй кўксимни кўзлаган сулув,
Эй Исрофил дам урган машшоқ.
Моғорлаган тушларимни юв,
Куйсираган торларимни боқ!
Эй косаси тилло муғбача,
Эй Каъбанинг эгаси, ориф.
Шаробингни иймонимга қуй,
Сажжодани нафсимга тўша!
Эй ёғмурлар олиб келган бўй,
Эй тийғидан ғайб ўпган ханжар.
Вужуд — ирганч балчиққа қориш,
Илвираган тасаввурни сўй!`
            },
            {
                id: "jontemir-2",
                title: "ЖОНТЕМИР",
                content: `Ажиб ҳолга тобеъман, жоним,
Балиқ топдим саҳро қаъридан.
Ғусл олар гўдак иймоним,
Ўзга олам дарёларидан.
Чанқадимми, илдиз сўраман,
Тўйинаман чайнаб ҳавони.
Момочақмоқ сочин ўраман,
Эгарлайман турна карвонин.
Тимдалайман қадим гўрларни,
Келтираман суяк гулханга.
Чимматини ечмас ҳурларнинг
Ишвасидан тиккум йўлхалта.
Кўзларимга тўлган ғам — ҳовуз
Бақалари сайрар — қалби тор.
Жим жойлайман қопга бир ҳовуч:
Алвидо! Алвидо!! Алвидо!!!
Ажиб ҳолга тобеъман, жоним.`
            },
            {
                id: "qargalar",
                title: "ҚАРҒАЛАР ҚАРИДИ",
                content: `Қарғалар қариди, Қаршининг гавжум
боғлари кимсасиз,
дарахтлари гунг.
Дўстим, мен дайди қалб қўлида қамчи,
Сен девор ортига қилиндинг сургун.
Боргим келмас ўшал шаҳарга, боргим,
Тилинган, эзилган, қийилган чора.
Чол каби кўринар кўчалар ҳорғин,
Қадрини йўқотган Қарлуқ, Муборак.
Қиш келди. Совуқдир панжара орти?
Тушларим жаннатдир, яша бемалол.
Шароб илтиганда ёқамдан тортиб,
Ёнингга судрайди ажина шамол.
Қўлим калта ахир, тилим ҳам қисир,
Қўшишдан қўрқаман ғуссанга ғусса.
Хаёлан ҳавода бир денгиз чизиб,
Ташлайман соғинчдан ясалган кўза.
Биламан, у сенга етиб бормайди,
Биламан, ўртада девор, панжара.
Токай ҳақиқатни дунё хўрлайди,
Токай бўйнимизда малъун панжалар?!
Дўстим, кўзларимнинг оқидаги оҳ
Тилимдан алжираб тўкилар — мастман.
Сен эмас, мен озод ҳолимда гумроҳ,
"Пивонинг тубига чўкади ҳасрат".
Ёлғизман, елкамда нигоҳинг изи,
Сўзлар қуршаб олган: сиртмоқ, қийноқ, ўқ.
Қиш келди, дўстгинам илвирсдай писиб,
Тушларим — жаҳаннам, яқинлашма, йўқ!
Қарғалар қариди, Қаршининг гавжум
боғлари кимсасиз,
дарахтлари гунг...`

            {
                id: "shahrizoda",
                title: "ШАҲРИЗОДА",
                content: `Шаҳризода, чироқлар ўчди,
Ёнди осмон ёнарқуртлари.
Малоиклар заминга кўчди,
Ташлаб ҳурлар қурган юртларин.
Шаҳризода, қанотимни юв,
Бўйнимдан қуч, кўзимни беркит.
Ой кўксидан томчилар инжу,
Чўмиламиз остида, ээркин.
Ёпишади сўзлар сочимга,
Киприкларим, бармоғимда сўз.
Кўр, коинот тор қучоғимда,
Гавҳаримга суйкалар юлдуз.
Шивирлайман, ёдлаб ол барин,
Менсимайди қоғозни бу ҳол.
Қуршаганда ғайб шамоллари,
Ўзингдан чиқ, ўзингда йўқол.
Совқотдингми, қуёш юнгидан
Тўн қавиймиз, сабр қил, толма.
Минг йил учиб жаннат сўнггига
Етолмаган Жибрилдай лолман.
Шаҳризода, қанотимдан ўп,
Ерда қолди қайчилар, хомуш.
Сомон йўлин бошоғин чўқиб,
Учиб борар баҳайбад оққуш...`
            },
            {
                id: "momo",
                title: "МОМOГИНАМ",
                content: `"Танҳоликда ўтарми умринг,
Мен набира, сен фарзанд кутмай?"
Бунча оғир қайғуга чўмдинг,
Момогинам, заҳролуд ютма.
Мен уйландим, фақат хаёлга,
Болаларим туғилар — ўлик.
Жойномозин сотиб май олган
Дарвешларим, бу не кўргулик?
Мингта оғиз эркимга соқчи,
Емлаб қолган Ғирот, Бойчибор.
Янги ранг бер руҳга, Бўёқчи,

Момо, шиддат ичинда кечмиш
Яфроқ умрим, титроқ юрагим.
Сиғинганим савдолар ҳечми?
Жазавани тиқсанг қўрага!
Сен улуғсан о, момочинор,
Суянганинг елвизак, нетай?
Оёғига қўйганми хино,
Сўлқиллайди йўл силкиб этак.
Ўчиргандир тоғлар ёдидан,
Дарёларим, балиқларим, қум.
Кўтарилиб вужуд — шотидан,
Пойингизга етарман бир кун.
Шунда қалбим куйлаб ҳофиздай,
Дарвешларим тўкиб майларин.
Чуғурлайди атрофингизда,
Тирик қолган болакайларим.
"Танҳоликда ўтарми..." ўтар,
Токи ажал қиргунча томоқ.
Балогардон, ғамларим ўтаб,
Сен ўтмайсан, ўтмайсан, момо!`
            },
            {
                id: "oy-mehringla",
                title: "ОЙ, МЕҲРИНГЛА",
                content: `Ой, меҳрингла юв ичим,
Сўнг кафтингда нур ичир.
Қақнусмидимки, куйсам?
Дам азобу дам савоб
Мендан қилар андиша.
Есам — шайтон ҳамтовоқ,

        // Theme Toggle Logic
        const invertBtn = document.getElementById('invertBtn');
        
        function setTheme(theme) {
            if (theme === 'xerox') {
                document.documentElement.setAttribute('data-theme', 'xerox');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            try {
                localStorage.setItem('tushlarTheme', theme);
            } catch (e) {}
        }

        try {
            const savedTheme = localStorage.getItem('tushlarTheme');
            if (savedTheme) setTheme(savedTheme);
        } catch (e) {}

        invertBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'xerox' ? 'dark' : 'xerox');
        });

        // Router
        function renderToc() {
            const list = document.getElementById('tocList');
            list.innerHTML = '';
            poems.forEach((poem, index) => {
                const num = String(index + 1).padStart(2, '0');
                list.innerHTML += `
                    <li class="toc-item">
                        <a href="#/p/${poem.id}">
                            <span class="toc-num">${num}</span>
                            <span class="toc-title">${poem.title}</span>
                        </a>
                    </li>
                `;
            });
        }

        function renderPoem(id) {
            const index = poems.findIndex(p => p.id === id);
            if (index === -1) return;
            const poem = poems[index];

            document.getElementById('poemTitle').innerText = poem.title;
            
            // Xavfsiz satrlarga ajratish va html
            const lines = poem.content.split('\n').map(line => {
                // Bo'sh satrlarni saqlab qolish
                if(line.trim() === '') return `<div class="poem-line" style="height: 1.9em;"></div>`;
                // Xavfsiz qilib chiqarish
                const safeLine = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div class="poem-line">${safeLine}</div>`;
            });
            
            document.getElementById('poemContent').innerHTML = lines.join('');

            // Navigation
            let navHtml = '';
            if (index > 0) {
                navHtml += `<a href="#/p/${poems[index-1].id}">← ОЛДИНГИ</a>`;
            } else {
                navHtml += `<span></span>`;
            }

            if (index < poems.length - 1) {
                navHtml += `<a href="#/p/${poems[index+1].id}">КЕЙИНГИ →</a>`;
            } else {
                navHtml += `<a href="#/toc">ТУШЛАР МОЗОРИГА ҚАЙТИШ</a>`;
            }
            document.getElementById('poemNav').innerHTML = navHtml;

            // Intersection Observer
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            document.querySelectorAll('.poem-line').forEach(line => {
                observer.observe(line);
            });
        }

        function handleRoute() {
            const hash = window.location.hash;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            window.scrollTo(0,0);

            if (hash === '#/toc') {
                document.getElementById('view-toc').classList.add('active');
                renderToc();
            } else if (hash.startsWith('#/p/')) {
                document.getElementById('view-poem').classList.add('active');
                renderPoem(hash.replace('#/p/', ''));
            } else {
                document.getElementById('view-cover').classList.add('active');
            }
        }

        // Scroll Progress
        window.addEventListener('scroll', () => {
            if (!document.getElementById('view-poem').classList.contains('active')) {
                document.getElementById('read-progress').style.height = '0%';
                return;
            }
            const scrollPx = document.documentElement.scrollTop;
            const winHeightPx = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = `${(scrollPx / winHeightPx) * 100}%`;
            document.getElementById('read-progress').style.height = scrolled;
        });

        window.addEventListener('hashchange', handleRoute);
        // Init
        handleRoute();
    </script>
